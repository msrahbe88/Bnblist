name: Check Solana new coins

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python solana_watcher.py

      - name: Commit updated state
        run: |
          git config user.name "solana-bot"
          git config user.email "actions@users.noreply.github.com"
          git add solana_state.json
          git diff --quiet --cached || git commit -m "Update Solana watcher state"
          git pull --rebase origin main
          git push
